name: nova_photos
description: "NOVA PHOTOS — an original Flutter Android client for an Immich server (public REST API, spec v3.4.2)."
# Private app: never publish to pub.dev.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Dependencies are PINNED to exact versions (see DEPENDENCIES.md for the
# justification of each). Run `flutter pub get` after any change, then
# re-pin the resolved versions from pubspec.lock.
dependencies:
  flutter:
    sdk: flutter

  # State management — Riverpod (compile-safe providers, no codegen).
  flutter_riverpod: 3.5.0
  riverpod: 3.5.0

  # Material 3 widgets — Flutter 3.50 moved them out of
  # package:flutter/material.dart into this package.
  material_ui: 1.11.1

  # HTTP client for the hand-written typed API client.
  http: 1.6.0

  # Offline cache (Track B) — Drift over SQLite.
  drift: 2.35.4
  sqlite3_flutter_libs: 0.5.42

  # Secure token storage (Android Keystore).
  flutter_secure_storage: 11.2.0

  # Authenticated, disk-cached thumbnails / previews.
  cached_network_image: 4.0.7

  # Local media scan for backup (Track C).
  photo_manager: 3.12.0

  # Background backup work (Track C).
  workmanager: 0.10.10

  # Live-update socket (Socket.IO) for server push events.
  socket_io_client: 3.1.6

  # Video playback in the viewer (Track B).
  video_player: 2.14.0

  # Android share sheet (Track B): share downloaded originals from the
  # viewer / selection bar via the system ACTION_SEND sheet.
  share_plus: 13.3.1

  # Dates / times in the timeline UI.
  intl: 0.20.3

  # Ids for sync checkpoints / upload dedup keys.
  uuid: 4.6.0

  # SHA-1 file checksums for upload dedup (bulk-upload-check).
  crypto: 3.0.7

  # App-support / cache directories.
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

  # App icon generation (dev-only; runs `dart run flutter_launcher_icons`).
  flutter_launcher_icons: 0.14.4

  # Drift codegen is NOT used (hand-written tables in Track B);
  # drift_dev / build_runner are intentionally absent.

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

# Launcher icon (dev-only): `dart run flutter_launcher_icons`.
# Source art is generated by tools/generate_icon.py (original work).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "assets/icons/icon_background.png"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icons/icon_monochrome.png"
  min_sdk_android: 21
