name: Build NOVA PHOTOS APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons (PNGs are not committed; regenerated from source)
        run: |
          pip install Pillow
          python3 tools/generate_icon.py
          dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: SHA-256 checksum
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk | tee app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-photos-apk
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-release.apk.sha256
          retention-days: 90
